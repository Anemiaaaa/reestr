<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Реестр задач</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23191919'/><rect x='4' y='4.2' width='8' height='1.6' rx='.8' fill='%23fff'/><rect x='4' y='7.2' width='8' height='1.6' rx='.8' fill='%23fff'/><rect x='4' y='10.2' width='4.6' height='1.6' rx='.8' fill='%23fff'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body class="login">
  <form class="login__box" id="form">
    <div class="login__title">Реестр задач</div>
    <div class="login__sub">В реестре лежат материалы заказчиков. Вход только для своих.</div>

    <label class="field__label" for="login">Логин</label>
    <input id="login" name="login" autocomplete="username" autofocus required>

    <label class="field__label" for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="err" id="err" hidden></div>
    <button class="btn btn--primary btn--wide" id="submit" type="submit">Войти</button>
  </form>

<script>
"use strict";

// Страница входа не тянет app.js: он весь про реестр, который здесь ещё не
// показан, и грузить его до входа незачем.
const form = document.getElementById("form");
const err = document.getElementById("err");
const submit = document.getElementById("submit");

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  err.hidden = true;
  submit.disabled = true;
  submit.textContent = "Проверяю…";

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        login: document.getElementById("login").value,
        password: document.getElementById("password").value,
      }),
    });
    if (res.ok) {
      location.href = "/";
      return;
    }
    const body = await res.json().catch(() => null);
    // Сообщение приходит с сервера и одинаково для любой неверной пары: иначе
    // подбирающий бесплатно узнаёт список заведённых логинов.
    err.textContent = (body && body.error) || "не удалось войти";
  } catch (e) {
    err.textContent = "сервер не ответил: " + e.message;
  }

  err.hidden = false;
  submit.disabled = false;
  submit.textContent = "Войти";
  document.getElementById("password").value = "";
  document.getElementById("password").focus();
});
</script>
</body>
</html>
